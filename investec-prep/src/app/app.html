<main class="app-shell">
  <h1>{{ title() }}</h1>

  <section class="lesson">
    <h2>Lesson 1 — Foundations</h2>

    <p>Counter value: {{ count() }}</p>
    <p>Double (computed): {{ double() }}</p>

    <button (click)="increment()">Increment</button>
    <button (click)="reset()" [disabled]="count() === 0">Reset</button>

    @if (count() > 5) {
      <p class="warn">That's a lot of clicks!</p>
    } @else if (count() > 0) {
      <p>Keep going…</p>
    }

    <ul>
      @for (item of items(); track item.id) {
        <li>{{ item.name }}</li>
      } @empty {
        <li>No items yet.</li>
      }
    </ul>
  </section>

  <router-outlet />
</main>
